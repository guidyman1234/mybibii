<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memories 📸</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background:#000; overflow:hidden; }
  body::before { display:none; }
  .story-viewer { position:fixed; inset:0; background:#0d0408; z-index:10; touch-action:pan-y; overflow:hidden; }

  /* photo: blurred copy fills the sides, real photo shown whole */
  .story-bg, .story-img { position:absolute; inset:0; width:100%; height:100%; transition:opacity .3s ease; opacity:0; }
  .story-bg  { object-fit:cover; filter:blur(28px) brightness(.55); transform:scale(1.15); }
  .story-img { object-fit:contain; user-select:none; -webkit-user-drag:none; }
  .story-fail { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; font-size:48px; color:#fff; }
  .story-fail p { font-size:13px; color:rgba(255,255,255,.4); }
  .story-overlay { position:absolute; inset:0; z-index:20; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,.3) 0%, transparent 28%, transparent 62%, rgba(0,0,0,.55) 100%); }

  .progress-bar-row { position:absolute; top:max(14px, env(safe-area-inset-top)); left:12px; right:12px; display:flex; gap:3px; z-index:30; }
  .prog-seg { flex:1; height:2.5px; border-radius:2px; background:rgba(255,255,255,.28); overflow:hidden; min-width:0; }
  .prog-fill { height:100%; background:#fff; width:0; }

  .story-topbar { position:absolute; top:max(28px, calc(env(safe-area-inset-top) + 14px)); left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; z-index:30; }
  .story-month-label { font-size:14px; font-weight:500; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.5); }
  .story-close { color:rgba(255,255,255,.9); font-size:20px; text-decoration:none; padding:4px 8px; }

  .story-caption { position:absolute; bottom:max(110px, calc(env(safe-area-inset-bottom) + 100px)); left:20px; right:20px; z-index:30; }
  .cap-text { font-family:var(--font-display); font-size:24px; font-weight:500; color:#fff; line-height:1.3; text-shadow:0 2px 14px rgba(0,0,0,.5); }
  .cap-counter { font-size:11px; color:rgba(255,255,255,.55); margin-top:6px; }

  .tap-left, .tap-right { position:absolute; top:70px; bottom:140px; width:38%; z-index:25; cursor:pointer; }
  .tap-left { left:0; } .tap-right { right:0; }

  .month-select-btn { position:absolute; bottom:max(76px, calc(env(safe-area-inset-bottom) + 68px)); left:50%; transform:translateX(-50%); z-index:35;
    background:rgba(255,255,255,.16); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.25);
    border-radius:50px; padding:7px 16px; color:#fff; font-family:var(--font-body); font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap; }
  .month-drawer { position:absolute; bottom:max(122px, calc(env(safe-area-inset-bottom) + 114px)); left:50%; transform:translateX(-50%) scaleY(.85); transform-origin:bottom center;
    opacity:0; pointer-events:none; z-index:40; background:rgba(18,6,12,.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.13); border-radius:20px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; max-width:300px; justify-content:center; transition:opacity .2s, transform .2s; }
  .month-drawer.open { opacity:1; transform:translateX(-50%) scaleY(1); pointer-events:auto; }
  .drawer-pill { padding:7px 14px; border-radius:50px; border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.8); font-size:12px; cursor:pointer; }
  .drawer-pill.active-month { background:rgba(232,120,154,.45); border-color:rgba(232,120,154,.6); color:#fff; }
</style>
</head>
<body data-hearts="off">

<div class="story-viewer" id="viewer">
  <img class="story-bg" id="bgImg" alt="">
  <img class="story-img" id="mainImg" alt="">
  <div class="story-fail" id="fail"><span>📸</span><p>Photo can't be shown</p></div>
  <div class="story-overlay"></div>

  <div class="progress-bar-row" id="bars"></div>
  <div class="story-topbar">
    <div class="story-month-label" id="monthLabel"></div>
    <a class="story-close" href="home.html">✕</a>
  </div>

  <div class="story-caption" id="caption"><div class="cap-text" id="capText"></div><div class="cap-counter" id="capCounter"></div></div>

  <div class="tap-left" onclick="prev()"></div>
  <div class="tap-right" onclick="next()"></div>

  <button class="month-select-btn" id="monthBtn" onclick="toggleDrawer()"><span id="monthBtnLabel">All months</span> ▾</button>
  <div class="month-drawer" id="drawer"></div>
</div>

<nav class="nav-bar" data-active="memories" style="z-index:50;"></nav>
<script src="script.js"></script>
<script>
/* =========================================================
   PHOTOS — add a line per photo:  { src:'images/may/xx.jpg', month:'may', caption:'' }
   Months with at least one photo show up in the picker automatically.
   ========================================================= */
const PHOTOS = [
  // NOVEMBER
  { src:'images/nov/1-11-2025.JPG',     month:'nov' },
  { src:'images/nov/13-11-2025.JPG',    month:'nov' },
  { src:'images/nov/13-11-2025-2.JPG',  month:'nov' },
  // DECEMBER
  { src:'images/dec/25-12-2025.JPG',    month:'dec' },
  { src:'images/dec/28-12-2025.JPG',    month:'dec' },
  { src:'images/dec/28-12-2025-2.JPG',  month:'dec' },
  { src:'images/dec/28-12-2025-3.JPG',  month:'dec' },
  // JANUARY
  { src:'images/jan/4-1-2026.PNG',      month:'jan' },
  { src:'images/jan/16-1-2026.PNG',     month:'jan' },
  { src:'images/jan/31-1-2026.JPG',     month:'jan' },
  { src:'images/jan/31-1-2026-2.JPG',   month:'jan' },
  // FEBRUARY
  { src:'images/feb/14-2-2026.JPG',     month:'feb' },
  { src:'images/feb/17-2-2026.HEIC',    month:'feb' },
  { src:'images/feb/18-2-2026.JPG',     month:'feb' },
  { src:'images/feb/18-2-2026-2.HEIC',  month:'feb' },
  // MARCH
  { src:'images/mar/1-3-2026.JPG',      month:'mar' },
  { src:'images/mar/1-3-2026-2.HEIC',   month:'mar' },
  { src:'images/mar/15-3-2026.PNG',     month:'mar' },
  { src:'images/mar/19-3-2026.jpg',     month:'mar' },
  // APRIL
  { src:'images/apr/3-4-2026.JPG',      month:'apr' },
  { src:'images/apr/8-4-2026.PNG',      month:'apr' },
  { src:'images/apr/19-4-2026.JPG',     month:'apr' },
  { src:'images/image/IMG_3842.PNG',    month:'apr' },
  // MAY → OCTOBER: add yours here, e.g.
  // { src:'images/may/1-5-2026.JPG', month:'may', caption:'6 months ♡' },
  // { src:'images/jun/xx.JPG', month:'jun' },
  // { src:'images/jul/xx.JPG', month:'jul' },
  // { src:'images/aug/xx.JPG', month:'aug' },
  // { src:'images/sep/xx.JPG', month:'sep' },
  // { src:'images/oct/xx.JPG', month:'oct' },
];

const ORDER = ['nov','dec','jan','feb','mar','apr','may','jun','jul','aug','sep','oct'];
const NAMES = { nov:'November', dec:'December', jan:'January', feb:'February', mar:'March', apr:'April',
                may:'May', jun:'June', jul:'July', aug:'August', sep:'September', oct:'October' };
const AUTO_MS = 5000;

let list = PHOTOS.slice(), cur = 0, timer = null;
const $ = id => document.getElementById(id);
const bgImg = $('bgImg'), mainImg = $('mainImg'), fail = $('fail');

function buildBars() {
  $('bars').innerHTML = '';
  list.forEach((_, i) => { const s = document.createElement('div'); s.className = 'prog-seg';
    const f = document.createElement('div'); f.className = 'prog-fill'; f.id = 'f' + i; s.appendChild(f); $('bars').appendChild(s); });
}

function show(i) {
  if (!list.length) return;
  cur = Math.max(0, Math.min(i, list.length - 1));
  const p = list[cur];
  mainImg.style.opacity = 0; bgImg.style.opacity = 0; fail.style.display = 'none';
  mainImg.src = p.src; bgImg.src = p.src;
  $('monthLabel').textContent = NAMES[p.month] || '';
  $('capText').textContent = p.caption || '';
  $('capCounter').textContent = (cur + 1) + ' / ' + list.length;

  list.forEach((_, k) => { const f = $('f' + k); f.style.transition = 'none'; f.style.width = k < cur ? '100%' : '0'; });
  clearTimeout(timer);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const f = $('f' + cur); f.style.transition = 'width ' + AUTO_MS + 'ms linear'; f.style.width = '100%';
  }));
  timer = setTimeout(next, AUTO_MS);
}
mainImg.onload = () => { mainImg.style.opacity = 1; bgImg.style.opacity = 1; fail.style.display = 'none'; };
mainImg.onerror = () => { mainImg.style.opacity = 0; bgImg.style.opacity = 0; fail.style.display = 'flex'; };

function next() { if (cur < list.length - 1) show(cur + 1); else clearTimeout(timer); }
function prev() { if (cur > 0) show(cur - 1); }

function pick(month, pill) {
  document.querySelectorAll('.drawer-pill').forEach(d => d.classList.remove('active-month'));
  pill.classList.add('active-month');
  $('monthBtnLabel').textContent = month === 'all' ? 'All months' : NAMES[month];
  list = month === 'all' ? PHOTOS.slice() : PHOTOS.filter(p => p.month === month);
  buildBars(); show(0); $('drawer').classList.remove('open');
}
function toggleDrawer() { $('drawer').classList.toggle('open'); }

(function buildDrawer() {
  const add = (label, month, active) => { const d = document.createElement('div'); d.className = 'drawer-pill' + (active ? ' active-month' : '');
    d.textContent = label; d.onclick = () => pick(month, d); $('drawer').appendChild(d); };
  add('All', 'all', true);
  ORDER.filter(m => PHOTOS.some(p => p.month === m)).forEach(m => add(NAMES[m], m, false));
})();

$('viewer').addEventListener('click', e => { if (!$('drawer').contains(e.target) && !$('monthBtn').contains(e.target)) $('drawer').classList.remove('open'); });
let tx = 0, ty = 0;
$('viewer').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive:true });
$('viewer').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) dx < 0 ? next() : prev();
}, { passive:true });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev(); });

buildBars(); show(0);
</script>
</body>
</html>
