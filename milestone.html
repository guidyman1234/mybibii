<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Milestone ✨</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-wrapper">
  <div class="page-top fade-up">
    <p class="page-eyebrow">1 year of us</p>
    <h1 class="page-title">Our story so far ♡</h1>
    <p class="page-sub">Every chapter that made us, us</p>
  </div>
  <div class="timeline-wrap" id="timeline"><div class="timeline-line"></div></div>
</div>

<nav class="nav-bar" data-active="milestone"></nav>
<script src="script.js"></script>
<script>
/* =========================================================
   CHAPTERS — edit text / photo path here.
   m = month, h = headline, b = body text, img = photo path ('' = no photo)
   Leave h and b empty ('') for months you haven't written yet.
   ========================================================= */
const CHAPTERS = [
  { m: 'November', h: 'Became a couple with Chuu',
    b: '15 days after the confession, our LDR began.',
    img: 'images/image/IMG_9085.JPG' },
  { m: 'December', h: '1 month in — loved you more, even when I annoyed you',
    b: 'A month before New Year. Luv u tee sood.',
    img: 'images/image/IMG_9758.PNG' },
  { m: 'January', h: '2 months already — love you kub',
    b: 'Tasmania girl, keep fighting kub Bibii.',
    img: 'images/image/IMG_0771.PNG' },
  { m: 'February', h: '3 months already — first quarter, done',
    b: 'Even when I messed things up this month, I always love you. Thank you for forgiving me kub.',
    img: 'images/image/IMG_1927.heic' },
  { m: 'March', h: '4 months — time for you to get back to work',
    b: 'Kyabram and people — including me — upset you many times, but I always love you na ka.',
    img: 'images/image/IMG_2996.PNG' },
  { m: 'April', h: '5 months already — just a little longer till we meet again',
    b: 'Time to start preparing for when we see each other.',
    img: 'images/image/IMG_2535.PNG' },
  { m: 'May', tag: '6 months 🎀', featured: true,
    h: '6 months already with you',
    b: 'Thank you for loving me even when I did so many things wrong, made you angry, or annoyed you so many times — but my heart has always been with you. Love you kub, my Bibii.',
    img: '' },
  { m: 'June',      h: '', b: '', img: '' },
  { m: 'July',      h: '', b: '', img: '' },
  { m: 'August',    h: '', b: '', img: '' },
  { m: 'September', h: '', b: '', img: '' },
  { m: 'October',   h: '', b: '', img: '' }
];

const tl = document.getElementById('timeline');
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

CHAPTERS.forEach((c, i) => {
  const row = el('div', 'tl-row fade-up fade-up-' + Math.min(5, 1 + Math.floor(i / 3)));
  const dotCol = el('div', 'tl-dot-col'); dotCol.appendChild(el('div', 'tl-dot' + (c.featured ? ' star' : '')));
  const content = el('div', 'tl-content');
  content.appendChild(el('div', 'tl-month', c.m + (c.tag ? ' · ' + c.tag : '')));
  const card = el('div', 'tl-card' + (c.featured ? ' featured' : ''));
  if (c.h) {
    card.appendChild(el('div', 'tl-headline', c.h));
    if (c.b) card.appendChild(el('div', 'tl-body', c.b));
  } else {
    card.appendChild(el('div', 'tl-headline empty', 'Chapter to be written ♡'));
  }
  if (c.img) {
    const img = el('img', 'tl-photo'); img.src = c.img; img.alt = c.m; img.loading = 'lazy';
    img.onerror = () => img.remove();
    card.appendChild(img);
  }
  content.appendChild(card); row.appendChild(dotCol); row.appendChild(content); tl.appendChild(row);
});

/* ---------- final card: 1 year ---------- */
(function final() {
  const left = daysToAnniversary();
  const row = el('div', 'tl-row fade-up fade-up-5');
  const dotCol = el('div', 'tl-dot-col'); dotCol.appendChild(el('div', 'tl-dot gold'));
  const content = el('div', 'tl-content');
  content.appendChild(el('div', 'tl-month', 'November · 1 year 🎀'));
  const card = el('div', 'tl-card anniv');
  card.appendChild(el('div', '', '🎀')).style.fontSize = '32px';
  card.appendChild(el('div', 'tl-headline', 'One year with you'));
  card.appendChild(el('div', 'tl-body', 'Thank you for every single day. Here’s to everything still ahead of us. ♡'));
  if (left > 0) {
    card.appendChild(el('div', 'cd-num', String(left)));
    card.appendChild(el('div', 'cd-label', left === 1 ? 'day to go' : 'days to go'));
  } else {
    card.appendChild(el('div', 'cd-num', '🎉'));
    card.appendChild(el('div', 'cd-label', left === 0 ? 'Happy anniversary!' : '1 year and counting'));
  }
  content.appendChild(card); row.appendChild(dotCol); row.appendChild(content); tl.appendChild(row);
  if (left === 0) burstHearts(30);
})();
</script>
</body>
</html>
